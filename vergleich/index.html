.seiten button{padding:7px 12px;border-radius:999px;color:var(--fg2);white-space:nowrap;font-size:14px}
.seiten button:hover{color:var(--hell)}

.kopf-r{margin-left:auto;display:flex;gap:8px;align-items:center}

.f-neu .etikett i{background:var(--kerze)}
.f-kunde .etikett i{background:#CBD3DD}
.f-kunde{display:none}
.mit-kunde .f-kunde{display:flex}

.liste h2{margin:0;padding:18px 20px 10px;font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--kerze-hell)}

.liste ol{list-style:none;margin:0;padding:0 10px 30px}
.liste li{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:12px 10px;border-top:1px solid var(--linie);cursor:pointer;border-radius:8px}

.liste li .vn s{opacity:.7}
.liste li .vn em{display:block;font-style:normal;color:var(--hell)}
.liste li .ks{margin-top:6px;font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--kerze-hell)}
.tabs{display:none}
@media (max-width:960px){

  .unter{overflow:hidden;text-overflow:ellipsis;font-size:9.5px}
  .kopf-r{margin-left:0;gap:6px}

  .seiten{order:3;width:100%;margin:0}

  .fenster{display:none}

  .tabs button.an{background:var(--kerze);color:#1A120E}
  .liste{width:100%;border-left:0}

var treiber = null, treiberTmr = 0, aktiv = -1, gefunden = {alt: [], neu: [], kunde: []}, skala = {alt: 1, neu: 1, kunde: 1};
var STIL = '.korr-el{outline:calc(2px * var(--kf,1)) solid #EF7649!important;outline-offset:calc(6px * var(--kf,1));border-radius:6px}.korr-ebene{position:absolute;left:0;top:0;width:100%;height:0;overflow:visible;z-index:9999;pointer-events:none}' +
  '.korr-nr{position:absolute;width:calc(28px * var(--kf,1));height:calc(28px * var(--kf,1));border-radius:50%;background:#EF7649;color:#1A120E;font:600 calc(13px * var(--kf,1))/calc(28px * var(--kf,1)) ui-monospace,Menlo,monospace;text-align:center;box-shadow:0 6px 18px -4px rgba(0,0,0,.7);pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%)}' +
  '.korr-nr.alt,.korr-nr.kunde{background:#FAF4F4;color:#16151A}.korr-nr.an{box-shadow:0 0 0 calc(4px * var(--kf,1)) rgba(239,118,73,.35),0 6px 18px -4px rgba(0,0,0,.7)}';

function liste() { return K[seite] || []; }
function doc(f) { try { return f.contentDocument; } catch (e) { return null; } }
function win(f) { try { return f.contentWindow; } catch (e) { return null; } }
function frame(name) { return name === 'alt' ? fa : name === 'neu' ? fn : fk; }
function ordner(name) { return name === 'alt' ? 'alt/' : name === 'neu' ? '../' : 'kunde/'; }
function spec(k, name) { return k[name === 'neu' ? 'neu' : 'alt'] || (k.sel ? {sel: k.sel} : null); }
function sichtbar(name) { return name !== 'kunde' || buehne.classList.contains('mit-kunde'); }

/* Alle Fenster zeigen die Website wie am Rechner (1440 px breit), verkleinert auf die Spaltenbreite; am Handy in natürlicher Grösse */
function masse() {
  FRAMES.forEach(function (name) {
    var f = frame(name), r = f.parentNode.getBoundingClientRect(); if (!r.width) return;
    var sk = (window.innerWidth > 960 && r.width < BASIS) ? r.width / BASIS : 1;
    skala[name] = sk;
    f.style.width = sk < 1 ? BASIS + 'px' : '100%';
    f.style.height = sk < 1 ? Math.round(r.height / sk) + 'px' : '100%';
    f.style.transform = sk < 1 ? 'scale(' + sk + ')' : 'none';
    var d = doc(f); if (d && d.documentElement) d.documentElement.style.setProperty('--kf', (1 / sk).toFixed(3));
  });
}

function finde(d, sp) {
  if (!d || !sp) return null;
  if (sp.sel) return d.querySelector(sp.sel);
  var wurzel = sp['in'] ? d.querySelector(sp['in']) : d.body;
  if (!wurzel) return null;
  var s = sp.exakt || sp.text, best = null, bestN = 1e9;
  var alle = wurzel.querySelectorAll('*');
  for (var i = 0; i < alle.length; i++) {
    var e = alle[i];
    if (/^(SCRIPT|STYLE|TEMPLATE)$/.test(e.tagName)) continue;
    var t = (e.textContent || '').replace(/\s+/g, ' ').trim();
    var ok = sp.exakt ? t === s : t.indexOf(s) >= 0;
    if (!ok) continue;
    var n = e.querySelectorAll('*').length;
    if (n < bestN) { best = e; bestN = n; }
  }
  return best;
}

/* Markieren: die Stellen einmal suchen (teuer), die Nummern beim Scrollen nur neu legen (billig) */
function suche(name) {
  var d = doc(frame(name)); if (!d || !d.body) return;
  if (!d.getElementById('korr-stil')) { var st = d.createElement('style'); st.id = 'korr-stil'; st.textContent = STIL; d.head.appendChild(st); }
  d.documentElement.style.setProperty('--kf', (1 / (skala[name] || 1)).toFixed(3));
  var alt = d.querySelectorAll('.korr-el'); for (var j = 0; j < alt.length; j++) alt[j].classList.remove('korr-el');
  gefunden[name] = liste().map(function (k) { var e = finde(d, spec(k, name)); if (e && name !== 'kunde') e.classList.add('korr-el'); return e; });
  lege(name);
}
function lege(name) {
  var f = frame(name), d = doc(f), w = win(f); if (!d || !d.body || !w) return;
  var eb = d.getElementById('korr-ebene');
  if (!eb) { eb = d.createElement('div'); eb.id = 'korr-ebene'; eb.className = 'korr-ebene'; d.body.appendChild(eb); }
  var els = gefunden[name] || [];
  while (eb.children.length > els.length) eb.removeChild(eb.lastChild);
  els.forEach(function (e, i) {
    var nr = eb.children[i];
    if (!nr) { nr = d.createElement('span'); nr.onclick = (function (i) { return function () { springe(i); }; })(i); eb.appendChild(nr); }
    nr.className = 'korr-nr ' + name + (i === aktiv ? ' an' : '');
    nr.textContent = i + 1; nr.title = liste()[i].t;
    if (!e) { nr.style.display = 'none'; return; }
    var k = liste()[i], a = (k && k.klick && d.querySelector(k.klick)) || e;   /* verborgene Antworten: die Nummer steht an der Frage */
    var r = a.getBoundingClientRect();
    nr.style.display = (r.width || r.height) ? '' : 'none';
    nr.style.left = (r.left + w.scrollX + 14) + 'px'; nr.style.top = (r.top + w.scrollY) + 'px';
  });
}
function sucheAlle() { FRAMES.forEach(suche); }
function legeAlle() { FRAMES.forEach(lege); }

/* Gleichlauf: die Abschnitte aller drei Seiten tragen dieselben Kennungen; dazwischen wird anteilig übertragen */
function anker(name) {
  var f = frame(name), d = doc(f), w = win(f); if (!d || !w) return [];
  var a = [{id: '', top: 0}];
  var ids = d.querySelectorAll('main section[id], main .vab[id]');
  for (var i = 0; i < ids.length; i++) {
    var e = ids[i]; if (w.getComputedStyle(e).position === 'fixed' || !e.id) continue;
    var r = e.getBoundingClientRect(); a.push({id: e.id, top: r.top + w.scrollY});
  }
  a.push({id: '~ende', top: Math.max(1, d.documentElement.scrollHeight - w.innerHeight)});
  return a.sort(function (x, y) { return x.top - y.top; });
}
function uebertrage(y, von, nach) {
  var A = anker(von), B = anker(nach), bk = {};
  B.forEach(function (b) { bk[b.id] = b.top; });
  var gem = A.filter(function (a) { return a.id in bk; });
  if (gem.length < 2) { var m1 = Math.max(1, A[A.length - 1].top), m2 = B[B.length - 1].top; return y / m1 * m2; }
  for (var i = 0; i < gem.length - 1; i++) {
    var a0 = gem[i], a1 = gem[i + 1];
    if (y >= a0.top && y <= a1.top) { var t = a1.top === a0.top ? 0 : (y - a0.top) / (a1.top - a0.top); return bk[a0.id] + t * (bk[a1.id] - bk[a0.id]); }
  }
  var l = gem[gem.length - 1]; return bk[l.id] + (y - l.top);
}
function sperren(wer, ms) { treiber = wer; clearTimeout(treiberTmr); treiberTmr = setTimeout(function () { treiber = null; }, ms); }
function beimScrollen(name) {
  lege(name);
  if (treiber && treiber !== name) return;          /* dieses Fenster wird gerade von einem anderen geführt */
  sperren(name, 160);
  var w = win(frame(name)); if (!w) return;
  FRAMES.forEach(function (andere) {
    if (andere === name) return;
    var w2 = win(frame(andere)); if (!w2 || !doc(frame(andere))) return;
    w2.scrollTo({top: uebertrage(w.scrollY, name, andere), behavior: 'instant'});   /* sofort, sonst erzeugt ein weiches Scrollen Nachläufer, die zurücksteuern */
    lege(andere);
  });
}

function seiteVon(f) { var w = win(f); if (!w) return ''; return (w.location.pathname.split('/').pop() || 'index').replace(/\.html$/, '') || 'index'; }
function lade(s) {
  seite = s; location.hash = 'seite=' + s;
  FRAMES.forEach(function (name) { var f = frame(name); if (seiteVon(f) !== s) f.src = ordner(name) + s + '.htm' + 'l'; });
  aktiv = -1; gefunden = {alt: [], neu: [], kunde: []}; baueListe(); zeichneSeiten();
}
function bereitMachen(name) {
  var f = frame(name);
  f.addEventListener('load', function () {
    var s = seiteVon(f), w = win(f), d = doc(f); if (!w || !d) return;
    if (s !== seite) { lade(s); return; }
    masse();
    w.addEventListener('scroll', function () { beimScrollen(name); }, {passive: true});
    w.addEventListener('resize', function () { suche(name); });
    d.addEventListener('click', function (ev) {
      var a = ev.target.closest && ev.target.closest('a[href]'); if (!a) return;
      var h = a.getAttribute('href') || ''; if (/^(https?:|mailto:|tel:)/.test(h)) a.target = '_blank';
      if (/\.html(#|$)/.test(h)) setTimeout(function () { var s2 = seiteVon(f); if (s2 !== seite) lade(s2); }, 300);
    });
    [300, 1200, 3000].forEach(function (ms) { setTimeout(function () { suche(name); }, ms); });
    /* ein frisch geladenes Fenster stellt sich auf die anderen ein */
    setTimeout(function () { var ref = name === 'neu' ? 'alt' : 'neu', wr = win(frame(ref)); if (wr && doc(frame(ref)) && wr.scrollY) { sperren(ref, 200); w.scrollTo({top: uebertrage(wr.scrollY, ref, name), behavior: 'instant'}); } }, 350);
  });
}
FRAMES.forEach(bereitMachen);

function springe(i) {
  var k = liste()[i]; if (!k) return; aktiv = i;
  sperren('springe', 900);
  FRAMES.forEach(function (name) {
    var f = frame(name), d = doc(f), w = win(f); if (!d || !w) return;
    if (k.klick) { var b = d.querySelector(k.klick); if (b) b.click(); }
    var e = finde(d, spec(k, name)); if (!e) return;
    var r = e.getBoundingClientRect();
    w.scrollTo({top: Math.max(0, r.top + w.scrollY - Math.round(w.innerHeight * .18)), behavior: 'smooth'});
  });
  setTimeout(sucheAlle, 950);
  var lis = document.querySelectorAll('#liste-ol li'); lis.forEach(function (li, j) { li.classList.toggle('an', j === i); });
  if (lis[i]) lis[i].scrollIntoView({block: 'nearest'});
}
function baueListe() {
  var ol = document.getElementById('liste-ol'); ol.innerHTML = '';
  liste().forEach(function (k, i) {
    var li = document.createElement('li');
    li.innerHTML = '<span class="nr">' + (i + 1) + '</span><div><b></b><div class="vn"><s></s><em></em></div>' + (k.kunde ? '<div class="ks">Eure Anmerkung · Seite ' + k.kunde + ' im PDF</div>' : '') + '</div>';
    li.querySelector('b').textContent = k.t; li.querySelector('s').textContent = k.vorher || ''; li.querySelector('em').textContent = k.nachher || '';
    li.onclick = function () { springe(i); }; ol.appendChild(li);
  });
  document.getElementById('anzahl').textContent = liste().length;
}
function zeichneSeiten() {
  var n = document.getElementById('seiten'); n.innerHTML = '';
  SEITEN.forEach(function (s) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = s[1] + (K[s[0]] && K[s[0]].length ? ' · ' + K[s[0]].length : '');
    b.className = s[0] === seite ? 'an' : ''; b.onclick = function () { lade(s[0]); }; n.appendChild(b);
  });
}
function neuMessen() { masse(); setTimeout(function () { sucheAlle(); var wn = win(fn); if (wn && doc(fn)) { sperren('neu', 200); beimScrollen('neu'); } }, 60); }
document.getElementById('kn-kunde').onclick = function () {
  var an = buehne.classList.toggle('mit-kunde'); this.classList.toggle('an', an); this.setAttribute('aria-pressed', an);
  if (an && !fk.src) fk.src = 'kunde/' + seite + '.htm' + 'l';
  if (an && window.innerWidth <= 960) tab('kunde');
  setTimeout(neuMessen, 50); setTimeout(neuMessen, 600);
};
document.getElementById('kn-liste').onclick = function () {
  var an = buehne.classList.toggle('mit-liste'); this.classList.toggle('an', an); this.setAttribute('aria-pressed', an);
  setTimeout(neuMessen, 50); setTimeout(neuMessen, 420);
};
function tab(t) { buehne.setAttribute('data-tab', t); document.querySelectorAll('.tabs button').forEach(function (b) { b.classList.toggle('an', b.getAttribute('data-tab') === t); }); setTimeout(neuMessen, 60); }
document.querySelectorAll('.tabs button').forEach(function (b) { b.onclick = function () { tab(b.getAttribute('data-tab')); if (b.getAttribute('data-tab') === 'kunde' && !buehne.classList.contains('mit-kunde')) document.getElementById('kn-kunde').click(); }; });
window.addEventListener('resize', function () { clearTimeout(window._rt); window._rt = setTimeout(neuMessen, 150); });
baueListe(); zeichneSeiten(); masse();
fa.src = 'alt/' + seite + '.htm' + 'l'; fn.src = '../' + seite + '.htm' + 'l';
</script>
